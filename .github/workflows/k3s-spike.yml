name: k3s spike (throwaway)
on:
  push:
    branches: [spike/k3s-docker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show runner facts
        run: |
          docker version
          docker compose version
          nproc; free -m
          cat /proc/self/cgroup || true
          ls /sys/fs/cgroup | head -20
      - name: Install kubectl and helm
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl
          curl -fsSL -o kubectl.sha256 https://dl.k8s.io/release/v1.34.11/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl version --client
          helm version --short
      - name: Generate token and ports
        run: |
          mkdir -p .local/k3s
          echo "K3S_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the three k3s nodes
        env:
          K3S_VERSION: v1.34.13-k3s1
          K3S_OUTPUT_DIR: ${{ github.workspace }}/.local/k3s
          K3S_API_PORT: "6443"
          K3S_HTTP_PORT: "8081"
          K3S_HTTPS_PORT: "8443"
        run: |
          docker compose -p k3s-lab -f k3s/compose/docker-compose.yml up -d
          sleep 45
          docker compose -p k3s-lab -f k3s/compose/docker-compose.yml ps
      - name: Dump server log
        if: always()
        run: |
          docker compose -p k3s-lab -f k3s/compose/docker-compose.yml logs --tail 120 server || true
          echo "=== kubeconfig ==="
          ls -la .local/k3s/ || true
          head -40 .local/k3s/kubeconfig 2>/dev/null || echo "no kubeconfig"
      - name: Try kubectl
        if: always()
        run: |
          if [ -f .local/k3s/kubeconfig ]; then
            sed -i 's#server: https://.*#server: https://127.0.0.1:6443#' .local/k3s/kubeconfig
            kubectl --kubeconfig .local/k3s/kubeconfig --insecure-skip-tls-verify get nodes -o wide || true
          fi
