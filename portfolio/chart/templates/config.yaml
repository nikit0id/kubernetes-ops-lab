apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-api
data:
  PGHOST: portfolio-postgres
  PGDATABASE: portfolio
  PGUSER: portfolio
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-db
type: Opaque
stringData:
  password: {{ required "Supply an existing Secret or database.password" .Values.database.password | quote }}
{{- end }}
