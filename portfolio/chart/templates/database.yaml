apiVersion: v1
kind: Service
metadata:
  name: portfolio-postgres
spec:
  clusterIP: None
  selector: {app: portfolio-postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portfolio-postgres
spec:
  serviceName: portfolio-postgres
  replicas: 1
  selector:
    matchLabels: {app: portfolio-postgres}
  template:
    metadata:
      labels: {app: portfolio-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: portfolio}
            - {name: POSTGRES_USER, value: portfolio}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret | default "portfolio-db" }}, key: password}
          readinessProbe:
            exec: {command: [pg_isready, -U, portfolio]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.database.size }}}
