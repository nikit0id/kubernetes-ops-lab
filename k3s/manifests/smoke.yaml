# Small workload used by scripts/k3s_lab.py verify to prove ingress + TLS.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
  labels:
    app.kubernetes.io/part-of: kubernetes-ops-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
  namespace: smoke
  labels:
    app: smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smoke
  template:
    metadata:
      labels:
        app: smoke
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ops-lab:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smoke
  namespace: smoke
spec:
  type: ClusterIP
  selector:
    app: smoke
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke
  namespace: smoke
  annotations:
    cert-manager.io/cluster-issuer: lab-selfsigned
spec:
  ingressClassName: nginx
  tls:
    - hosts: [smoke.lab.localhost]
      secretName: smoke-tls
  rules:
    - host: smoke.lab.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke
                port:
                  name: http
