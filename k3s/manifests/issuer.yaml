# The lab has no public DNS name, so a self-signed root stands in for ACME.
# The root secret is created once by scripts/k3s_lab.py; cert-manager only signs with it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-selfsigned
spec:
  ca:
    secretName: lab-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: cert-manager
spec:
  secretName: lab-wildcard-tls
  commonName: lab.localhost
  dnsNames:
    - lab.localhost
    - "*.lab.localhost"
  issuerRef:
    name: lab-selfsigned
    kind: ClusterIssuer
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
